# Enforced by the restricted Pod Security Standard in the Kind install; see the chart README.
component:
  admin:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
