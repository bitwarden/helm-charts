# Overlay for the Kind install's BYOS (bring your own secrets) scenario, layered on top of
# test-values.yaml or test-gateway-values.yaml by scripts/setup.sh.
# setup.sh creates the encryption keys (in custom-secret) and custom-identity-cert before the
# install, so the chart generates neither.
secrets:
  secretKeys:
    generate: false
  identityCertificate:
    generate: false
    secretName: custom-identity-cert
