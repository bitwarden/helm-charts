suite: vulnerable identity certificate password check
templates:
  - templates/utils/_secret-checks.tpl
  - templates/utils/vulnerable-secret-check.yaml

# Guards against the SHOT-159 / VULN-553 regression where chart versions earlier
# than 2.0.0 encrypted identity.pfx with the literal string "map[]".
#
# helm-unittest cannot stub the `lookup` function, so the positive path - a
# vulnerable secret present in the cluster blocking the upgrade - is not
# reachable here, and neither is the certPresent branching in the failure
# message. These tests cover the no-cluster paths and lock in that the check
# renders no output and never fails a legitimate install.
#
# The block itself, both message branches, and the README rotation procedure were
# verified end to end against a real KIND install: a genuine pre-2.0.0 chart
# install produced the map[] password, the upgrade to the fixed chart was blocked,
# and the documented rotation unblocked it. If you refactor this check, re-run
# that matrix by hand - the scenarios are listed in the description of the PR that
# introduced this file (bitwarden/helm-charts#583).

tests:
  - it: renders no output and does not fail when the certificate is generated
    template: templates/utils/vulnerable-secret-check.yaml
    set:
      secrets.identityCertificate.generate: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no output and does not fail with a user-provided certificate secret
    template: templates/utils/vulnerable-secret-check.yaml
    set:
      secrets.identityCertificate.generate: false
      secrets.identityCertificate.secretName: custom-certificate-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: does not fail when generate is false and no secret name is set
    # secrets.identityCertificate.secretName is enforced by the `required` in
    # helpers.tpl, not by this check. This template must stay quiet so that the
    # operator sees that error rather than one from here.
    template: templates/utils/vulnerable-secret-check.yaml
    set:
      secrets.identityCertificate.generate: false
      secrets.identityCertificate.secretName: ""
    asserts:
      - hasDocuments:
          count: 0
