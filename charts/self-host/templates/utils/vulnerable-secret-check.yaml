{{/*
Blocks `helm install` and `helm upgrade` when the identity certificate password is vulnerable.

`fail` aborts the render before Helm sends anything to the API server, so this runs before any
hook job and leaves an existing release untouched rather than in a failed state.

Only the secret actually in use is checked. When generate is false the chart-generated secret may
still exist from an earlier install but is unused, so flagging it would be a false positive.

certPresent selects the remediation advice. A user-provided secret holds identity.pfx and the
password together, so the certificate always travels with the password being inspected and
certPresent is true. On the generate path the certificate is a separate secret and may be absent,
in which case the password is an orphan and rotation is impossible.

This is a usability guard, not an enforcement boundary. `lookup` returns nothing
during `helm template` and `--dry-run`, and also when the caller's kubeconfig
cannot read secrets in the namespace, in which case the check silently passes.

This template intentionally renders no output.
*/}}
{{- $passwordKey := "globalSettings__identityServer__certificatePassword" }}
{{- $secretName := "" }}
{{- $certPresent := false }}
{{- if .Values.secrets.identityCertificate.generate }}
{{-   $secretName = printf "%s-identity-cert-password" .Release.Name }}
{{-   $certPresent = not (not (lookup "v1" "Secret" .Release.Namespace (printf "%s-identity-cert" .Release.Name))) }}
{{- else }}
{{-   $secretName = .Values.secrets.identityCertificate.secretName }}
{{-   $certPresent = true }}
{{- end }}
{{- if $secretName }}
{{-   $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{-   if and $secret $secret.data (hasKey $secret.data $passwordKey) }}
{{-     $password := index $secret.data $passwordKey | b64dec }}
{{-     include "bitwarden.assertSafeIdentityCertPassword" (dict "password" $password "secretName" $secretName "namespace" .Release.Namespace "certPresent" $certPresent) }}
{{-   end }}
{{- end }}
